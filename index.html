<!DOCTYPE html>
<html lang="en" class="h-full bg-[#0B0F17] text-slate-100 antialiased">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>Ally | Civic-Tech & Health Advocacy</title>

    <!-- Google Fonts: Space Grotesk (Neo-futuristic headers) & Raleway (Clean body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: "#448AFF",
                        bgDark: "#0B0F17",
                        panelDark: "#111726",
                    },
                    fontFamily: {
                        display: ['Space Grotesk', 'sans-serif'],
                        body: ['Raleway', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>

<body
    class="h-full flex flex-col justify-between font-body relative overflow-x-hidden selection:bg-brand selection:text-white">

    <!-- Subtle Neo-Futuristic Background Glow -->
    <div
        class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[300px] bg-brand/10 blur-[140px] pointer-events-none rounded-full">
    </div>
    <div
        class="absolute inset-0 bg-[linear-gradient(to_right,#1f293d0a_1px,transparent_1px),linear-gradient(to_bottom,#1f293d0a_1px,transparent_1px)] bg-[size:4rem_4rem] pointer-events-none">
    </div>

    <!-- Header / Navbar -->
    <header class="relative z-10 w-full max-w-5xl mx-auto px-6 py-8 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <img src="favicon.svg" alt="Ally logo" class="h-8 w-8" />
            <p class="inline-flex items-center gap-1.5 px-2.5 py-0.5 text-[10px] font-bold bg-slate-900 text-white">
                ALLY
            </p>
        </div>
        <!-- <div class="text-xs font-display tracking-widest text-slate-500 uppercase">
            NIGERIA
        </div> -->
    </header>

    <!-- Main Content Hero -->
    <main class="relative z-10 my-auto w-full max-w-2xl mx-auto px-6 py-12 text-center">

        <!-- Status Pill -->
        <!-- <div
            class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-slate-900/80 border border-slate-800 text-slate-300 mb-8 backdrop-blur-md">
            <span class="text-brand">✦</span> Women-Led • Health & Safety Infrastructure
        </div> -->

        <!-- Headline -->
        <h1 class="font-display text-4xl sm:text-6xl font-bold tracking-tight text-white mb-6 leading-[1.1]">
            The future of community health is youth-led.
        </h1>

        <!-- Subtitle -->
        <p class="text-slate-400 text-base sm:text-lg leading-relaxed mb-10 max-w-xl mx-auto">
            Translating clinical health into grassroots education and safe digital infrastructure for women
            and at-risk youth across Nigeria.
        </p>

        <!-- Email Waitlist Form -->
        <form onsubmit="event.preventDefault();" class="max-w-md mx-auto">
            <div
                class="flex flex-col sm:flex-row items-center gap-2 p-1.5 bg-slate-900/90 border border-slate-800 rounded-xl sm:rounded-full backdrop-blur-xl focus-within:border-brand/50 transition-colors shadow-2xl">
                <input type="email" placeholder="Enter email for updates..." required
                    class="w-full bg-transparent px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none rounded-full">
                <button type="submit"
                    class="w-full sm:w-auto px-6 py-3 bg-brand hover:bg-blue-600 text-white font-display font-medium text-xs tracking-wider uppercase rounded-lg sm:rounded-full transition-all shrink-0 active:scale-95">
                    Join Movement
                </button>
            </div>
            <!-- <p class="text-[11px] text-slate-600 mt-3 font-display tracking-wide uppercase">
                Zero spam • Clinical advocacy & community updates
            </p> -->
        </form>

    </main>

    <!-- Footer -->
    <!-- <footer
        class="relative z-10 w-full max-w-5xl mx-auto px-6 py-8 text-center sm:text-left flex flex-col sm:flex-row items-center justify-between gap-4 border-t border-slate-900/80">
        <p class="text-xs text-slate-600 font-body">
            © 2026 Ally Social Impact Organization. All rights reserved.
        </p>
        <div class="flex items-center gap-6 text-xs text-slate-500 font-display uppercase tracking-wider">
            <a href="#" class="hover:text-slate-300 transition-colors">SRMNCAH</a>
            <a href="#" class="hover:text-slate-300 transition-colors">SafetyAlly</a>
            <a href="#" class="hover:text-slate-300 transition-colors">Contact</a>
        </div>
    </footer> -->

</body>

</html>
